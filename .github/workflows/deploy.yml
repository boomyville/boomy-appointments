name: Deploy to Oracle VM

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Dry run (list what would change, upload nothing)"
        type: boolean
        default: false

# Never run two deploys at once
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Reject UTF-8 BOM in PHP files
        run: |
          if grep -rlI $'\xEF\xBB\xBF' --include='*.php' .; then
            echo "Deployment stopped: a PHP file contains a UTF-8 BOM."
            exit 1
          fi

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Record start time
        id: start-time
        run: echo "time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Upload files
        id: rsync-upload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          FLAGS="-rlvz --itemize-changes --chmod=D755,F644"
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi

          # Run rsync and capture output
          RSYNC_OUTPUT=$(rsync $FLAGS \
            --exclude='.git/' --exclude='.github/' --exclude='.gitignore' \
            --exclude='/config.php' --exclude='/adminer.php' --exclude='/manager.php' --exclude='/design/' \
            --exclude='/README.md' --exclude='/install.sql' --exclude='/config_sample.php' --exclude='/application' \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/")
          
          echo "$RSYNC_OUTPUT"

          # Filter changed files (lines starting with <, >, or c)
          CHANGED_FILES=$(echo "$RSYNC_OUTPUT" | grep -E '^[<>\.c][fcd>]' || echo "No files changed or initial sync.")
          
          delimiter="$(openssl rand -hex 8)"
          echo "changed_files<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT

      - name: Fix file permissions on server
        if: ${{ inputs.dry_run != true }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            $DEPLOY_USER@$DEPLOY_HOST "sudo chown -R 1000:1000 $DEPLOY_PATH"

      - name: Build Deployment Summary
        if: always()
        run: |
          END_TIME=$(date +%s)
          START_TIME=${{ steps.start-time.outputs.time }}
          DURATION=$(( END_TIME - START_TIME ))
          
          BRANCH_NAME="${{ inputs.branch }}"
          if [ -z "$BRANCH_NAME" ]; then BRANCH_NAME="main (push)"; fi
          
          MODE="🚀 Live Deployment"
          if [ "${{ inputs.dry_run }}" = "true" ]; then MODE="🧪 Dry Run (No files modified)"; fi

          STATUS="❌ Failed"
          if [ "${{ job.status }}" = "success" ]; then STATUS="✅ Success"; fi

          echo "### Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | $STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mode** | $MODE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`$BRANCH_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Duration** | ${DURATION} seconds |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📋 File Changes Breakdown:" >> $GITHUB_STEP_SUMMARY
          echo "| Rsync Code | File Path / Action |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              CODE=$(echo "$line" | awk '{print $1}')
              FILE=$(echo "$line" | cut -d' ' -f2-)
              echo "| \`$CODE\` | \`$FILE\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done << 'EOF'
${{ steps.rsync-upload.outputs.changed_files }}
EOF